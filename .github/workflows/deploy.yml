name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Requires repository secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            if [ -f /opt/conjiweb-src/manage.sh ]; then
              cd /opt/conjiweb-src
            elif [ -f /opt/conjiweb-src/web_Conji_native/manage.sh ]; then
              cd /opt/conjiweb-src/web_Conji_native
            else
              echo "manage.sh not found under /opt/conjiweb-src"
              exit 1
            fi
            bash manage.sh update
